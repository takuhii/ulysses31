<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Ulysses 31 — The Mythology Companion">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="1" stop-color="#0d1230"/>
    </linearGradient>
    <radialGradient id="olympus" cx="82%" cy="6%" r="60%">
      <stop offset="0" stop-color="#2a1e5c"/>
      <stop offset="1" stop-color="#2a1e5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deep" cx="6%" cy="100%" r="55%">
      <stop offset="0" stop-color="#163449"/>
      <stop offset="1" stop-color="#163449" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d27a"/>
      <stop offset="1" stop-color="#a9803f"/>
    </linearGradient>
    <linearGradient id="ship" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45e0ff"/>
      <stop offset="1" stop-color="#1f9fd6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#olympus)"/>
  <rect width="1200" height="630" fill="url(#deep)"/>

  <!-- stars -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="150" cy="120" r="1.6"/>
    <circle cx="320" cy="80" r="1.2"/>
    <circle cx="520" cy="150" r="1.4"/>
    <circle cx="980" cy="90" r="1.6"/>
    <circle cx="1120" cy="200" r="1.2"/>
    <circle cx="200" cy="520" r="1.4"/>
    <circle cx="1060" cy="470" r="1.6"/>
    <circle cx="700" cy="540" r="1.2"/>
  </g>
  <g fill="#f5d27a" opacity="0.8">
    <circle cx="1020" cy="150" r="2"/>
    <circle cx="900" cy="240" r="1.6"/>
    <circle cx="1130" cy="320" r="1.6"/>
  </g>

  <!-- planetary rings around a cosmic Olympus -->
  <g transform="translate(1000 170) rotate(-18)">
    <ellipse cx="0" cy="0" rx="150" ry="42" fill="none" stroke="#8f78e6" stroke-width="1.6" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="185" ry="54" fill="none" stroke="#45e0ff" stroke-width="1.2" opacity="0.32"/>
  </g>
  <!-- Olympus columns -->
  <g stroke="url(#gold)" stroke-width="3" fill="none" opacity="0.85">
    <path d="M948 200 h104"/>
    <path d="M956 200 v-40 M976 200 v-40 M996 200 v-40 M1016 200 v-40 M1036 200 v-40 M1044 200 v-40"/>
    <path d="M944 160 h112"/>
    <path d="M958 160 l42 -20 l42 20"/>
  </g>

  <!-- the Odyssey spacecraft -->
  <g transform="translate(150 470) rotate(-12)">
    <path d="M0 0 L150 -18 L188 0 L150 18 Z" fill="url(#ship)"/>
    <path d="M50 -12 L120 -12 L130 0 L120 12 L50 12 Z" fill="#0d1230" opacity="0.7"/>
    <path d="M24 -8 L42 0 L24 8 Z" fill="#f5d27a"/>
    <circle cx="2" cy="0" r="8" fill="#ff6b45" opacity="0.75"/>
    <circle cx="-10" cy="0" r="13" fill="#ff6b45" opacity="0.22"/>
  </g>

  <!-- text -->
  <text x="80" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="6" fill="#f5d27a" style="text-transform:uppercase">ULYSSES 31 &#183; MYTHOLOGY COMPANION</text>

  <text x="80" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="8" fill="#45e0ff">THE MYTHOLOGY COMPANION</text>
  <text x="78" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="#ffffff">Ulysses 31</text>
  <text x="80" y="470" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#cfc4a8">What if Homer&#8217;s Odyssey happened in the 31st century?</text>

  <rect x="80" y="540" width="120" height="3" fill="#a9803f"/>
  <text x="216" y="549" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#a7add0">The Odyssey was only the beginning.</text>
</svg>
